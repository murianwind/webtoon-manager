name: Tests

# 코드가 바뀔 때마다(main이 아닌 브랜치 푸시, PR) 백엔드/화면 테스트를 돌린다. 수동 실행(workflow_dispatch)도 가능하다.
# main 푸시는 build.yml이 이 워크플로를 불러서(workflow_call) 테스트한 뒤 이미지를 빌드하므로, 여기서 따로 돌지 않는다(중복 방지).
# 실제 카카오/네이버 서버는 부르지 않는다.
on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# 같은 브랜치에 푸시가 잇따라 오면 이전 실행은 취소하고 가장 마지막 것만 실행한다.
# 그룹 이름에 event_name을 넣는 이유: build.yml이 이 파일을 불러 쓸 때 그쪽 그룹(build-...)과 이름이 같으면 서로 취소해 버린다.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트 (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Dockerfile과 같은 버전
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: 정적 검사 (미사용 임포트/변수, 미정의 이름)
        run: python -m pyflakes app tests/backend

      - name: 깃헙 액션 설정 검사 (actionlint)
        run: actionlint .github/workflows/*.yml

      - name: 백엔드 테스트
        run: python tests/run_backend.py

  frontend:
    name: 화면 테스트 (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/js/package-lock.json

      - name: 스크립트 문법 검사
        run: for f in app/static/js/*.js; do node --check "$f"; done

      - name: 의존성 설치
        working-directory: tests/js
        run: npm ci

      - name: 화면 테스트
        working-directory: tests/js
        run: npm test
