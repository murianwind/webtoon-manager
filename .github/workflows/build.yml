name: Build and publish image

# main에 푸시되면 먼저 테스트(tests.yml)를 돌리고, 통과했을 때만 이미지를 빌드해서 GHCR에 올린다.
# 이 이미지가 올라오면 Watchtower가 자동으로 받아서 갱신한다(도움말 탭의 README도 같이 바뀐다).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# 푸시가 잇따라 오면 이전 실행(테스트/빌드 중이던 것)은 강제로 취소하고 가장 마지막 푸시만 실행한다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests            # 테스트가 하나라도 실패하면 이미지를 만들지 않는다
    if: github.ref == 'refs/heads/main'   # 수동 실행(workflow_dispatch)을 다른 브랜치에서 눌러도 latest 이미지는 main에서만 만든다
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
