# GitHub Actions가 push할 때마다 미리 빌드해서 GHCR에 올려주는 이미지를 pull해서 씁니다.
# 로컬 빌드가 필요 없어서, CLI에서 `docker compose up -d`로 바로 실행하거나
# Portainer의 "Web editor"에 이 내용을 그대로 붙여넣어도 됩니다 (repository 연결/clone/fork 필요 없음).
#
# 자동 업데이트: 아래 labels에 있는 com.centurylinklabs.watchtower.enable=true 는
# Watchtower용 표시입니다. 이미 Watchtower를 쓰고 계시면(--label-enable 옵션이 켜져
# 있는 경우) 새 이미지가 올라올 때마다 자동으로 갱신됩니다.

services:
  webtoon-manager:
    image: ghcr.io/murianwind/webtoon-manager:latest
    container_name: webtoon-manager
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DOWNLOAD_ROOT: /data/Webtoon_Download
      DATABASE_PATH: /data/webtoons.db
      COOKIE_FILE_PATH: /cookies/${COOKIE_FILE_NAME:-cookies.json}
    volumes:
      # 실제 다운로드 폴더 (기존 D:\Downloads\Webtoon\Webtoon_Download 그대로 사용)
      - ${WEBTOON_DOWNLOAD_HOST_PATH}:/data/Webtoon_Download
      # DB/설정 영속 볼륨
      - ${APP_DATA_HOST_PATH}:/data
      # 브라우저 쿠키 export 파일이 들어있는 폴더 (파일명은 COOKIE_FILE_NAME으로 지정)
      # /data 밑이 아니라 완전히 별도 경로(/cookies)에 마운트한다 — /data와 겹친 채로
      # 두면(예전엔 /data/cookies였음) 도커가 컨테이너를 준비할 때 그 자리를 미리
      # 만들면서 APP_DATA_HOST_PATH 쪽 호스트 폴더에 빈 "cookies" 폴더가 계속
      # 생겨나는 부작용이 있었다(실제로 사용자가 겪음) — 경로를 분리해서 근본적으로 없앤다.
      - ${COOKIE_DIR_HOST_PATH}:/cookies:ro
