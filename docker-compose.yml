# GitHub Actions가 push할 때마다 미리 빌드해서 GHCR에 올려주는 이미지를 pull해서 씁니다.
# 로컬 빌드가 필요 없어서, CLI에서 `docker compose up -d`로 바로 실행하거나
# Portainer의 "Web editor"에 이 내용을 그대로 붙여넣어도 됩니다 (repository 연결/clone/fork 필요 없음).
#
# 자동 업데이트: 아래 labels에 있는 com.centurylinklabs.watchtower.enable=true 는
# Watchtower용 표시입니다. 이미 Watchtower를 쓰고 계시면(--label-enable 옵션이 켜져
# 있는 경우) 새 이미지가 올라올 때마다 자동으로 갱신됩니다.

services:
  naver-webtoon-manager:
    image: ghcr.io/murianwind/naver-webtoon-manager:latest
    container_name: naver-webtoon-manager
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DOWNLOAD_ROOT: /data/Webtoon_Download
      DATABASE_PATH: /data/webtoons.db
      COOKIE_FILE_PATH: /data/cookies/${COOKIE_FILE_NAME:-cookies.json}
      WEBTOON_WEBHOOK_URL: ${WEBTOON_WEBHOOK_URL:-}
      WEBTOON_BOT_TOKEN: ${WEBTOON_BOT_TOKEN:-}
      WEBTOON_NOTIFY_CHANNEL_ID: ${WEBTOON_NOTIFY_CHANNEL_ID:-}
      WEBTOON_TAG_IDS: ${WEBTOON_TAG_IDS:-134,133}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-360}
      DOWNLOAD_INTERVAL_MINUTES: ${DOWNLOAD_INTERVAL_MINUTES:-60}
      COMMANDS_ONLY_INTERVAL_MINUTES: ${COMMANDS_ONLY_INTERVAL_MINUTES:-5}
    volumes:
      # 실제 다운로드 폴더 (기존 D:\Downloads\Webtoon\Webtoon_Download 그대로 사용)
      - ${WEBTOON_DOWNLOAD_HOST_PATH}:/data/Webtoon_Download
      # DB/설정 영속 볼륨
      - ${APP_DATA_HOST_PATH}:/data
      # 브라우저 쿠키 export 파일이 들어있는 폴더 (파일명은 COOKIE_FILE_NAME으로 지정)
      - ${COOKIE_DIR_HOST_PATH}:/data/cookies:ro
