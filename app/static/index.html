<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹툰 구독 관리</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>웹툰 구독 관리</h1>
  </header>

  <nav class="main-tabs">
    <button class="main-tab active" data-page="naver-list">네이버 웹툰 전체목록</button>
    <button class="main-tab" data-page="active">구독중</button>
    <button class="main-tab" data-page="unsubscribed">구독해제</button>
    <button class="main-tab" data-page="excluded">제외됨</button>
    <button class="main-tab" data-page="settings">설정</button>
  </nav>

  <!-- 네이버 전체 목록 -->
  <section id="page-naver-list" class="page">
    <div class="toolbar">
      <input id="naver-list-search" type="text" placeholder="제목으로 검색" />
      <button id="btn-refresh-naver-list">새로고침</button>
    </div>
    <div id="naver-list-grid" class="webtoon-grid"></div>
    <p id="naver-list-empty" class="hidden empty-message">불러온 목록이 없습니다.</p>
  </section>

  <!-- 구독중 -->
  <section id="page-active" class="page hidden">
    <div id="active-list" class="webtoon-grid"></div>
    <p id="active-empty" class="hidden empty-message">구독 중인 웹툰이 없습니다.</p>
  </section>

  <!-- 구독해제 -->
  <section id="page-unsubscribed" class="page hidden">
    <div id="unsubscribed-list" class="webtoon-grid"></div>
    <p id="unsubscribed-empty" class="hidden empty-message">구독 해제한 웹툰이 없습니다.</p>
  </section>

  <!-- 제외됨 -->
  <section id="page-excluded" class="page hidden">
    <div id="excluded-list" class="webtoon-grid"></div>
    <p id="excluded-empty" class="hidden empty-message">목록에서 제외한 웹툰이 없습니다.</p>
  </section>

  <!-- 설정 -->
  <section id="page-settings" class="page hidden">
    <div class="settings-card">
      <h2>실행 주기</h2>
      <div class="settings-form">
        <label>신작 스캔 주기 (분)
          <input id="setting-scan" type="number" min="1" />
        </label>
        <label>다운로드 주기 (분)
          <input id="setting-download" type="number" min="1" />
        </label>
        <label>디스코드 명령 확인 주기 (분)
          <input id="setting-commands" type="number" min="1" />
        </label>
      </div>
      <button id="btn-save-settings">저장</button>
      <span id="settings-save-result" class="error"></span>
    </div>

    <div class="settings-card">
      <h2>수동 실행</h2>
      <div class="manual-run-buttons">
        <button id="btn-run-discovery">신작 스캔 실행</button>
        <button id="btn-run-download">다운로드 실행</button>
      </div>

      <div class="job-status-block">
        <h3>신작 스캔 상태 <span id="discovery-status-badge" class="badge">idle</span></h3>
        <pre id="discovery-log" class="job-log"></pre>
      </div>
      <div class="job-status-block">
        <h3>다운로드 상태 <span id="download-status-badge" class="badge">idle</span></h3>
        <pre id="download-log" class="job-log"></pre>
      </div>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
